<?php /** @var array $orders */ ?>
<?php $staffLayout = $staffLayout ?? false; ?>
<section class="<?= $staffLayout ? 'staff-workspace staff-history-workspace' : '' ?>">
    <?php if ($staffLayout): ?>
        <div class="section-head">
            <div>
                <h1>Order history</h1>
                <p class="staff-intro">Your account's recent orders and payment details.</p>
            </div>
        </div>
    <?php else: ?>
        <h1>History</h1>
    <?php endif; ?>
    <?php if (!$orders): ?>
        <div class="empty <?= $staffLayout ? 'staff-history-empty' : '' ?>">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <p>No orders yet.</p>
        </div>
    <?php else: ?>
        <div class="history-list <?= $staffLayout ? 'staff-history-list' : '' ?>">
            <?php foreach ($orders as $order): ?>
                <article class="history-order <?= $staffLayout ? 'staff-order-card' : '' ?>">
                    <header class="<?= $staffLayout ? 'staff-order-heading' : '' ?>">
                        <div>
                            <strong>Order #<?= (int) $order['id'] ?></strong>
                            <span><?= e(date('M j, Y · g:ia', strtotime($order['created_at']))) ?></span>
                        </div>
                        <em class="status status-<?= e($order['status']) ?>"><?= e($order['status']) ?></em>
                    </header>
                    <?php if ($order['payment']): ?>
                        <p class="payment-status <?= $staffLayout ? 'staff-history-payment' : '' ?>">
                            Payment: <?= e(ucfirst($order['payment']['payment_method'])) ?> ·
                            <?= e(ucfirst($order['payment']['payment_status'])) ?>
                        </p>
                    <?php endif; ?>
                    <?php if ($staffLayout): ?>
                        <form class="history-status-controls" method="post" action="<?= url('staff/orders/status') ?>">
                            <?= csrf_field() ?>
                            <input type="hidden" name="order_id" value="<?= (int) $order['id'] ?>">
                            <input type="hidden" name="return_to" value="history">
                            <label>
                                <span>Order status</span>
                                <select name="status">
                                    <?php foreach (['preparing', 'completed', 'cancelled'] as $status): ?>
                                        <option value="<?= e($status) ?>" <?= $order['status'] === $status ? 'selected' : '' ?>><?= e(ucfirst($status)) ?></option>
                                    <?php endforeach; ?>
                                </select>
                            </label>
                            <button class="btn btn-primary" type="submit">Update status</button>
                        </form>
                    <?php endif; ?>
                    <?php foreach ($order['items'] as $item): ?>
                        <div class="history-row <?= $staffLayout ? 'staff-history-row' : '' ?>">
                            <div class="thumb-fallback"><i class="fa-solid fa-mug-hot"></i></div>
                            <div class="grow">
                                <strong><?= e($item['name']) ?></strong>
                                <span>Qty <?= (int) $item['qty'] ?> · <?= money((float) $item['price']) ?></span>
                            </div>
                            <strong><?= money((float) $item['price'] * $item['qty']) ?></strong>
                        </div>
                    <?php endforeach; ?>
                    <footer class="<?= $staffLayout ? 'staff-history-total' : '' ?>">Total <?= money((float) $order['total']) ?></footer>
                </article>
            <?php endforeach; ?>
        </div>
    <?php endif; ?>
</section>
