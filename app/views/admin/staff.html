<script>
(() => {
    const search = document.querySelector('[data-staff-account-search]');
    const cards = [...document.querySelectorAll('[data-staff-account-card]')];
    const pager = document.querySelector('[data-staff-account-pagination]');
    const count = document.querySelector('[data-staff-account-count]');
    const noResults = document.querySelector('[data-staff-account-no-results]');
    if (!search || !pager) return;
    const pageSize = 5;
    let page = 1;

    function render() {
        const query = search.value.trim().toLowerCase();
        const matchingCards = cards.filter(card => card.dataset.searchText.toLocaleLowerCase().includes(query));
        const pageCount = Math.max(1, Math.ceil(matchingCards.length / pageSize));
        page = Math.min(page, pageCount);
        cards.forEach(card => { card.hidden = true; });
        matchingCards.slice((page - 1) * pageSize, page * pageSize).forEach(card => { card.hidden = false; });
        if (count) count.textContent = `${matchingCards.length} account${matchingCards.length === 1 ? '' : 's'}`;
        if (noResults) noResults.hidden = matchingCards.length > 0;
        pager.replaceChildren();
        if (pageCount <= 1) return;

        const addButton = (label, target, disabled = false, active = false) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'page-button' + (active ? ' is-active' : '');
            button.textContent = label;
            button.disabled = disabled;
            if (active) button.setAttribute('aria-current', 'page');
            button.addEventListener('click', () => { page = target; render(); });
            pager.append(button);
        };
        addButton('‹', page - 1, page === 1);
        const firstPage = Math.min(page, Math.max(1, pageCount - 2));
        const lastPage = Math.min(pageCount, firstPage + 2);
        for (let number = firstPage; number <= lastPage; number++) {
            addButton(String(number), number, false, number === page);
        }
        addButton('›', page + 1, page === pageCount);
    }

    search.addEventListener('input', () => { page = 1; render(); });
    render();
})();
</script>
