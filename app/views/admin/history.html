<script>
(() => {
    const list = document.querySelector('[data-pagination-list="admin-order-history"]');
    const pager = document.querySelector('[data-pagination="admin-order-history"]');
    if (!list || !pager) return;
    const cards = [...list.querySelectorAll('.admin-history-card')];
    const pageSize = 10;
    let page = 1;
    function render() {
        const pageCount = Math.max(1, Math.ceil(cards.length / pageSize));
        page = Math.min(page, pageCount);
        cards.forEach((card, index) => { card.hidden = index < (page - 1) * pageSize || index >= page * pageSize; });
        pager.replaceChildren();
        if (pageCount <= 1) return;
        const addButton = (label, target, disabled = false, active = false) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'page-button' + (active ? ' is-active' : '');
            button.textContent = label;
            button.disabled = disabled;
            if (active) button.setAttribute('aria-current', 'page');
            button.addEventListener('click', () => { page = target; render(); });
            pager.append(button);
        };
        addButton('‹', page - 1, page === 1);
        const firstPage = Math.min(Math.max(1, page), Math.max(1, pageCount - 2));
        const lastPage = Math.min(pageCount, firstPage + 2);
        for (let number = firstPage; number <= lastPage; number++) addButton(String(number), number, false, number === page);
        addButton('›', page + 1, page === pageCount);
    }
    render();
})();
</script>
