<script>
(() => {
    const filters = [...document.querySelectorAll('[data-category-filter]')];
    const rows = [...document.querySelectorAll('.menu-admin-list [data-menu-category]')];
    const pager = document.querySelector('[data-pagination="admin-menu"]');
    if (!pager || !rows.length) return;
    const pageSize = 6;
    let selected = 'all';
    let page = 1;
    const filteredRows = () => rows.filter(row => selected === 'all' || row.dataset.menuCategory === selected);
    function render() {
        const matches = filteredRows();
        const pageCount = Math.max(1, Math.ceil(matches.length / pageSize));
        page = Math.min(page, pageCount);
        rows.forEach(row => { row.hidden = true; });
        matches.slice((page - 1) * pageSize, page * pageSize).forEach(row => { row.hidden = false; });
        pager.replaceChildren();
        if (matches.length <= pageSize) return;
        const addButton = (label, target, disabled = false, active = false) => {
            const button = document.createElement('button');
            button.type = 'button'; button.className = 'page-button' + (active ? ' is-active' : '');
            button.textContent = label; button.disabled = disabled;
            if (active) button.setAttribute('aria-current', 'page');
            button.addEventListener('click', () => { page = target; render(); });
            pager.append(button);
        };
        addButton('‹', page - 1, page === 1);
        const firstPage = Math.min(Math.max(1, page), Math.max(1, pageCount - 2));
        const lastPage = Math.min(pageCount, firstPage + 2);
        for (let n = firstPage; n <= lastPage; n++) addButton(String(n), n, false, n === page);
        addButton('›', page + 1, page === pageCount);
    }
    filters.forEach(button => button.addEventListener('click', () => {
        selected = button.dataset.categoryFilter; page = 1;
        filters.forEach(filter => {
            const active = filter === button;
            filter.classList.toggle('is-active', active);
            filter.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
        render();
    }));
    render();
})();
</script>
