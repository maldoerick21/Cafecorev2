                <button class="btn btn-cancel-edit" type="button" id="add-order-line"><i class="fa-solid fa-plus"></i> Add product</button>

                <div class="staff-order-line">
                    <label>
                        Product

                    </label>

                        Sugar
                        <select name="items[0][sugar]">

            </div>
        </form>
        <template id="order-line-template">
            <div class="staff-order-line">
                <label>
                    Product
                    <select name="items[__INDEX__][item_id]" required>
                        <option value="">Select a product</option>
                        <?php foreach ($items as $item): ?>
                            <option value="<?= (int) $item['id'] ?>"><?= e($item['name']) ?> · <?= money((float) $item['price']) ?></option>
                        <?php endforeach; ?>
                    </select>
                </label>
                <label>
                    Size
                    <select name="items[__INDEX__][size]">
                        <option value="Small">Small</option>
                        <option value="Medium" selected>Medium (+₱15)</option>
                        <option value="Large">Large (+₱25)</option>
                    </select>
                </label>
                <label>
                    Sugar
                    <select name="items[__INDEX__][sugar]">
                        <?php foreach ([0, 25, 50, 75, 100] as $sugar): ?>
                            <option value="<?= $sugar ?>" <?= $sugar === 100 ? 'selected' : '' ?>><?= $sugar ?>%</option>
                        <?php endforeach; ?>
                    </select>
                </label>
                <label>
                    Qty
                    <input type="number" name="items[__INDEX__][qty]" value="1" min="1" max="99" required>
                </label>
                <button class="icon-btn remove-order-line" type="button" aria-label="Remove product"><i class="fa-solid fa-trash"></i></button>
            </div>
        </template>
        <script>
            (() => {
                const list = document.getElementById('staff-order-lines');
                const template = document.getElementById('order-line-template');
                const addButton = document.getElementById('add-order-line');
                let nextIndex = 1;
                const updateRemoveButtons = () => {
                    const buttons = [...list.querySelectorAll('.remove-order-line')];
                    buttons.forEach(button => { button.disabled = buttons.length === 1; });
                };
                addButton.addEventListener('click', () => {
                    const row = template.content.firstElementChild.cloneNode(true);
                    row.querySelectorAll('[name]').forEach(field => {
                        field.name = field.name.replace('__INDEX__', String(nextIndex));
                    });
                    nextIndex += 1;
                    list.append(row);
                    updateRemoveButtons();
                });
                list.addEventListener('click', event => {
                    const button = event.target.closest('.remove-order-line');
                    if (button && !button.disabled) {
                        button.closest('.staff-order-line').remove();
                        updateRemoveButtons();
                    }
                });
            })();
        </script>
    <?php endif; ?>
</section>
